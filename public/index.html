<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It Pink Club | Achadinhos e Boutique Feminina</title>

    <!-- Google Fonts: Poppins para uma tipografia moderna, elegante e feminina -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =================================================================
           IDENTIDADE VISUAL IT PINK CLUB - BOUTIQUE PREMIUM
           ================================================================ */
        :root {
            --pink-primary: #E91E63;       /* Rosa principal de destaque */
            --pink-hover: #D81B60;         /* Tom mais forte para hover */
            --pink-light: #FCE4EC;         /* Fundo suave rosa claro */
            --pink-pastel: #F8BBD0;        /* Rosa pastel para bordas e detalhes */
            --gold-accent: #D4AF37;        /* Dourado elegante para detalhes */
            --text-dark: #2C2C2C;          /* Texto principal legível e sofisticado */
            --bg-soft: #FFF5F8;            /* Fundo geral da página com toque rosa suave */
            --card-bg: #FFFFFF;            /* Fundo branco puro dos cards */
            --shadow-soft: 0 10px 30px rgba(233, 30, 99, 0.08); /* Sombra difusa em rosa */
            --shadow-hover: 0 15px 35px rgba(233, 30, 99, 0.15);/* Sombra ampliada no hover */
            --radius-card: 16px;           /* Bordas arredondadas modernas */
            --radius-button: 30px;         /* Botões pílula femininos */
        }

        /* Reset e Base */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-soft) !important;
            color: var(--text-dark) !important;
            font-family: 'Poppins', sans-serif !important;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Tipografia Sofisticada */
        h1, h2, h3, h4, h5, h6, .title, .store-title, .brand-name {
            color: var(--text-dark) !important;
            font-family: 'Poppins', sans-serif !important;
            font-weight: 700 !important;
            letter-spacing: -0.5px;
        }

        /* =================================================================
           BOTÕES COM IDENTIDADE IT PINK
           ================================================================ */
        button, .btn, .btn-primary, .add-to-cart, a.button, .buy-button {
            background-color: var(--pink-primary) !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: var(--radius-button) !important;
            font-family: 'Poppins', sans-serif !important;
            font-weight: 600 !important;
            padding: 12px 26px !important;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3) !important;
            transition: all 0.3s ease !important;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover, .btn:hover, .btn-primary:hover, .add-to-cart:hover, a.button:hover {
            background-color: var(--pink-hover) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4) !important;
        }

        /* =================================================================
           VITRINE E CARDS DE PRODUTOS (Estilo Boutique / Pinterest)
           ================================================================ */
        .product-card, .card, .item-produto, .produto-card {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--pink-pastel) !important;
            border-radius: var(--radius-card) !important;
            box-shadow: var(--shadow-soft) !important;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;
            margin-bottom: 20px;
        }

        .product-card:hover, .card:hover, .item-produto:hover, .produto-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover) !important;
            border-color: var(--pink-primary) !important;
        }

        /* Imagens dos Produtos Valorizadas */
        .product-card img, .card img, .item-produto img, .produto-card img {
            border-top-left-radius: var(--radius-card);
            border-top-right-radius: var(--radius-card);
            transition: transform 0.5s ease !important;
            width: 100%;
            object-fit: cover;
        }

        .product-card:hover img, .card:hover img, .item-produto:hover img {
            transform: scale(1.03);
        }

        /* =================================================================
           BANNERS SOFISTICADOS COM CANTOS ARREDONDADOS
           ================================================================ */
        img.banner, .banner img, .carousel img, .hero-banner img, .banner-container {
            border-radius: var(--radius-card) !important;
            box-shadow: var(--shadow-soft) !important;
            border: 2px solid var(--pink-pastel) !important;
            overflow: hidden;
        }

        /* =================================================================
           CATEGORIAS (Blocos Arredondados e Detalhes em Rosa)
           ================================================================ */
        .category-item, .categoria-card, .filter-chip, .categoria-pill {
            background-color: #FFFFFF !important;
            border: 1px solid var(--pink-pastel) !important;
            border-radius: var(--radius-button) !important;
            padding: 10px 22px !important;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.04);
            transition: all 0.3s ease !important;
            font-weight: 500;
            color: var(--text-dark);
        }

        .category-item:hover, .categoria-card:hover, .filter-chip:hover, .categoria-pill:hover,
        .category-item.active, .categoria-card.active {
            background-color: var(--pink-light) !important;
            border-color: var(--pink-primary) !important;
            color: var(--pink-primary) !important;
        }

        /* =================================================================
           DETALHES PREMIUM E OTIMIZAÇÃO MOBILE
           ================================================================ */
        .gold-badge, .badge-premium {
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                padding: 0 4px;
            }
            .product-card, .card {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Container original preservado do site -->
    <div id="app"></div>

    <!-- Script original mantido intacto -->
    <script src="js/app.js"></script>
</body>
</html>
