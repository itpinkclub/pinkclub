<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo | It Pink Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fff0f6; margin: 0;">
    <div style="background: white; padding: 2.5rem; border-radius: 1.5rem; border: 1px solid #ffe3f0; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: var(--pink); margin-top: 0; margin-bottom: 0.5rem;">💖 Restrito</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem;">Entre com sua senha para gerenciar o site</p>
        
        <form onsubmit="fazerLogin(event)" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Senha de Acesso</label>
                <input type="password" id="senha-admin" required placeholder="Digite sua senha" style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit; box-sizing: border-box;">
            </div>

            <button type="submit" style="background: linear-gradient(135deg, #ec4899, #f43f5e); color: white; border: none; padding: 0.9rem; border-radius: 9999px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3); font-size: 1rem; margin-top: 0.5rem;">
                Entrar no Painel
            </button>
        </form>
    </div>

    <script>
        function fazerLogin(event) {
            event.preventDefault();
            const senha = document.getElementById('senha-admin').value;
            
            // Senha padrão configurada (você pode alterar se preferir)
            if (senha === "babydele777") { 
                localStorage.setItem("logado", "true");
                window.location.href = "admin.html";
            } else {
                alert("Senha incorreta!");
            }
        }
    </script>
</body>
</html>
