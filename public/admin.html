<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - It Pink Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topo">
        <a href="/" class="logo">💖 Painel Admin | It Pink Club</a>
        <p>Gerencie os achadinhos do seu site</p>
    </header>

    <main class="vitrine">
        <section class="admin-container" style="max-width: 600px; margin: 0 auto; background: var(--surface); padding: 2rem; border-radius: 1.5rem; border: 1px solid #ffe3f0; box-shadow: var(--shadow);">
            <h2 style="color: var(--pink); margin-top: 0; text-align: center; margin-bottom: 1.5rem;">Adicionar Novo Produto</h2>
            
            <form id="form-produto" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Título do Produto</label>
                    <input type="text" id="titulo-prod" required style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
                </div>

                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Categoria</label>
                    <select id="categoria-prod" required style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit; background: #fff;">
                        <option value="skincare">Skincare</option>
                        <option value="cabelo">Cabelos</option>
                        <option value="moda">Moda</option>
                        <option value="infantil">Infantil</option>
                        <option value="fitness">Fitness</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Link do Afiliado (Shopee/Outros)</label>
                    <input type="url" id="link-prod" required placeholder="https://..." style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
                </div>

                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Link da Imagem</label>
                    <input type="url" id="imagem-prod" required placeholder="https://..." style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
                </div>

                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem;">Preço (Opcional)</label>
                    <input type="text" id="preco-prod" placeholder="Ex: R$ 49,90" style="width: 100%; padding: 0.8rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
                </div>

                <button type="submit" class="comprar" style="border: none; cursor: pointer; margin-top: 1rem;">Cadastrar Produto</button>
            </form>
        </section>
    </main>
</body>
</html>
