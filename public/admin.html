<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>💖 Painel Admin | It Pink Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fff5f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 1rem; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1); }
        h1 { color: #d63384; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; color: #555; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ffccd5; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; }
        button { background: linear-gradient(135deg, #ec4899, #f43f5e); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.2); }
        button:hover { opacity: 0.9; }
        .lista-produtos { margin-top: 30px; }
        .item-admin { display: flex; justify-content: space-between; align-items: center; background: #fff0f6; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; }
        .btn-excluir { background: #ef4444; width: auto; padding: 6px 12px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>💖 Cadastrar Achadinho</h1>
    
    <form id="form-produto">
        <div class="form-group">
            <label>Título do Produto</label>
            <input type="text" id="titulo" required placeholder="Ex: Organizador de Maquiagem">
        </div>
        
        <div class="form-group">
            <label>Categoria</label>
            <select id="categoria">
                <option value="skincare">Beleza</option>
                <option value="casa">Casa</option>
                <option value="moda">Moda</option>
                <option value="tecnologia">Tecnologia</option>
                <option value="papelaria">Papelaria</option>
                <option value="pets">Pets</option>
            </select>
        </div>

        <div class="form-group">
            <label>Link da Imagem (URL ou Foto)</label>
            <input type="text" id="imagem" required placeholder="Cole o link da foto ou arraste">
        </div>

        <div class="form-group">
            <label>Link de Afiliado da Shopee</label>
            <input type="url" id="link" required placeholder="https://shope.ee/...">
        </div>

        <button type="submit">Cadastrar Achadinho 🚀</button>
    </form>

    <div class="lista-produtos">
        <h2>Gerenciar Produtos Cadastrados</h2>
        <div id="container-admin"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9ojNdDkM9M6iO16SW8k7wfWnnJbvHS40",
      authDomain: "itpinkclub-a786e.firebaseapp.com",
      projectId: "itpinkclub-a786e",
      storageBucket: "itpinkclub-a786e.firebasestorage.app",
      messagingSenderId: "716111814812",
      appId: "1:716111814812:web:06e1c76950d39021698d59",
      measurementId: "G-3XSF7CYT1D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('form-produto');
    const containerAdmin = document.getElementById('container-admin');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const novoProduto = {
            titulo: document.getElementById('titulo').value,
            categoria: document.getElementById('categoria').value,
            imagem: document.getElementById('imagem').value,
            link: document.getElementById('link').value,
            criadoEm: new Date()
        };

        try {
            await addDoc(collection(db, "produtos"), novoProduto);
            alert('Achadinho cadastrado com sucesso na nuvem! 💖');
            form.reset();
        } catch (error) {
            console.error("Erro ao cadastrar: ", error);
            alert('Erro ao cadastrar produto.');
        }
    });

    // Listar e permitir exclusão no admin em tempo real
    onSnapshot(collection(db, "produtos"), (snapshot) => {
        containerAdmin.innerHTML = '';
        if (snapshot.empty) {
            containerAdmin.innerHTML = '<p style="color: #666; font-size: 0.9rem;">Nenhum produto na nuvem.</p>';
            return;
        }

        snapshot.forEach((documento) => {
            const prod = documento.data();
            const id = documento.id;

            const div = document.createElement('div');
            div.className = 'item-admin';
            div.innerHTML = `
                <span style="font-size: 0.9rem; font-weight: 500;">${prod.titulo}</span>
                <button class="btn-excluir" onclick="window.excluirProduto('${id}')">Excluir</button>
            `;
            containerAdmin.appendChild(div);
        });
    });

    window.excluirProduto = async function(id) {
        if (confirm('Deseja realmente excluir este achadinho?')) {
            try {
                await deleteDoc(doc(db, "produtos", id));
            } catch (error) {
                console.error("Erro ao excluir: ", error);
            }
        }
    };
</script>

</body>
</html>
