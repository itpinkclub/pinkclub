<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - It Pink Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topo" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
        <div>
            <a href="/" class="logo">💖 Painel Admin | It Pink Club</a>
            <p style="margin: 0;">Gerencie todos os achadinhos</p>
        </div>
        <button onclick="fazerLogout()" style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.5rem 1rem; border-radius: 9999px; cursor: pointer; font-weight: 500; font-size: 0.9rem;">
            🚪 Sair
        </button>
    </header>

    <main class="vitrine" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
        <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <button onclick="window.location.href='adicionar.html'" style="background: linear-gradient(135deg, #ec4899, #f43f5e); color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 9999px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3); font-size: 1rem;">
                ➕ Adicionar Produto
            </button>

            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                <button onclick="filtrarAdmin('todos')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">✨ Todos</button>
                <button onclick="filtrarAdmin('skincare')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">💄 Beleza</button>
                <button onclick="filtrarAdmin('casa')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🏠 Casa</button>
                <button onclick="filtrarAdmin('moda')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">👗 Moda</button>
                <button onclick="filtrarAdmin('tecnologia')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">📱 Tecnologia</button>
                <button onclick="filtrarAdmin('papelaria')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🎨 Papelaria</button>
                <button onclick="filtrarAdmin('pets')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🐾 Pets</button>
            </div>

            <input type="text" id="pesquisa-admin" placeholder="🔍 Pesquisar produto..." style="width: 100%; padding: 0.8rem 1rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
        </div>

        <hr style="border: none; border-top: 1px solid #ffe3f0; margin: 2rem 0;">

        <h2 style="color: var(--pink); margin-bottom: 1.5rem; font-size: 1.4rem;">📦 Produtos Cadastrados</h2>

        <div id="lista-produtos-admin" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <!-- Os produtos cadastrados aparecerão aqui dinamicamente -->
        </div>
    </main>

    <script>
        // Produtos iniciais de exemplo caso não haja nada salvo
        let produtos = JSON.parse(localStorage.getItem('produtos_pink')) || [
            { id: 1, titulo: "Organizador Giratório de Maquiagem", categoria: "skincare", preco: "R$ 49,90", imagem: "" },
            { id: 2, titulo: "Difusor de Aromas Efeito Chama", categoria: "casa", preco: "R$ 79,90", imagem: "" }
        ];

        function renderizarProdutos(lista) {
            const container = document.getElementById('lista-produtos-admin');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">Nenhum produto cadastrado.</p>';
                return;
            }

            lista.forEach((prod, index) => {
                const card = document.createElement('div');
                card.style.cssText = "background: white; border: 1px solid #ffe3f0; border-radius: 1.2rem; padding: 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.5rem;";
                
                card.innerHTML = `
                    <div style="background: #fff0f6; height: 160px; border-radius: 0.8rem; display: flex; align-items: center; justify-content: center; color: var(--pink); font-weight: 600; overflow: hidden;">
                        ${prod.imagem ? `<img src="${prod.imagem}" style="width:100%; height:100%; object-fit:cover;">` : '📷 Imagem'}
                    </div>
                    <h3 style="font-size: 1.05rem; margin: 0.3rem 0; color: #333;">${prod.titulo}</h3>
                    <span style="font-size: 0.85rem; color: #db2777; font-weight: 500;">Categoria: ${prod.categoria}</span>
                    <strong style="color: #111; font-size: 1.1rem; margin-top: 0.2rem;">${prod.preco || ''}</strong>
                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                        <button onclick="editarProduto(${index})" style="flex: 1; padding: 0.5rem; background: #fdf2f8; border: 1px solid #fbcfe8; color: #db2777; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">✏️ Editar</button>
                        <button onclick="excluirProduto(${index})" style="flex: 1; padding: 0.5rem; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">🗑 Excluir</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function excluirProduto(index) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                produtos.splice(index, 1);
                localStorage.setItem('produtos_pink', JSON.stringify(produtos));
                renderizarProdutos(produtos);
            }
        }

        function filtrarAdmin(cat) {
            if (cat === 'todos') {
                renderizarProdutos(produtos);
            } else {
                const filtrados = produtos.filter(p => p.categoria === cat);
                renderizarProdutos(filtrados);
            }
        }

        function fazerLogout() {
            localStorage.removeItem("logado");
            window.location.href = "/";
        }

        // Carrega os produtos ao iniciar a página
        renderizarProdutos(produtos);
    </script>
</body>
</html>
