<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - It Pink Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topo">
        <a href="/" class="logo">💖 Painel Admin | It Pink Club</a>
        <p>Gerencie todos os achadinhos</p>
    </header>

    <main class="vitrine" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
        <!-- Seção de Ações e Filtros -->
        <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <button onclick="abrirModalAdicionar()" style="background: linear-gradient(135deg, #ec4899, #f43f5e); color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 9999px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3); font-size: 1rem;">
                ➕ Adicionar Produto
            </button>

            <!-- Filtros de Categoria -->
            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                <button onclick="filtrarAdmin('todos')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">✨ Todos</button>
                <button onclick="filtrarAdmin('skincare')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">💄 Beleza</button>
                <button onclick="filtrarAdmin('casa')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🏠 Casa</button>
                <button onclick="filtrarAdmin('moda')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">👗 Moda</button>
                <button onclick="filtrarAdmin('tecnologia')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">📱 Tecnologia</button>
                <button onclick="filtrarAdmin('papelaria')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🎨 Papelaria</button>
                <button onclick="filtrarAdmin('pets')" style="padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid #f6b8d6; background: #fff; cursor: pointer; font-weight: 500;">🐾 Pets</button>
            </div>

            <!-- Barra de Pesquisa -->
            <input type="text" id="pesquisa-admin" placeholder="🔍 Pesquisar produto..." style="width: 100%; padding: 0.8rem 1rem; border: 1px solid #f6b8d6; border-radius: 1rem; outline-color: var(--pink); font: inherit;">
        </div>

        <hr style="border: none; border-top: 1px solid #ffe3f0; margin: 2rem 0;">

        <!-- Produtos Cadastrados -->
        <h2 style="color: var(--pink); margin-bottom: 1.5rem; font-size: 1.4rem;">📦 Produtos Cadastrados</h2>

        <div id="lista-produtos-admin" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <!-- Cartão Exemplo 1 -->
            <div style="background: white; border: 1px solid #ffe3f0; border-radius: 1.2rem; padding: 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="background: #fff0f6; height: 160px; border-radius: 0.8rem; display: flex; align-items: center; justify-content: center; color: var(--pink); font-weight: 600;">📷 Imagem</div>
                <h3 style="font-size: 1.05rem; margin: 0.3rem 0; color: #333;">Organizador Giratório de Maquiagem</h3>
                <span style="font-size: 0.85rem; color: #db2777; font-weight: 500;">💄 Beleza & Autocuidado</span>
                <strong style="color: #111; font-size: 1.1rem; margin-top: 0.2rem;">R$ 49,90</strong>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button style="flex: 1; padding: 0.5rem; background: #fdf2f8; border: 1px solid #fbcfe8; color: #db2777; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">✏️ Editar</button>
                    <button style="flex: 1; padding: 0.5rem; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">🗑 Excluir</button>
                </div>
            </div>

            <!-- Cartão Exemplo 2 -->
            <div style="background: white; border: 1px solid #ffe3f0; border-radius: 1.2rem; padding: 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="background: #fff0f6; height: 160px; border-radius: 0.8rem; display: flex; align-items: center; justify-content: center; color: var(--pink); font-weight: 600;">📷 Imagem</div>
                <h3 style="font-size: 1.05rem; margin: 0.3rem 0; color: #333;">Difusor de Aromas Efeito Chama</h3>
                <span style="font-size: 0.85rem; color: #db2777; font-weight: 500;">🏠 Casa & Decoração</span>
                <strong style="color: #111; font-size: 1.1rem; margin-top: 0.2rem;">R$ 79,90</strong>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button style="flex: 1; padding: 0.5rem; background: #fdf2f8; border: 1px solid #fbcfe8; color: #db2777; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">✏️ Editar</button>
                    <button style="flex: 1; padding: 0.5rem; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 0.6rem; cursor: pointer; font-weight: 500;">🗑 Excluir</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function filtrarAdmin(cat) {
            console.log("Filtrando por: " + cat);
        }
        function abrirModalAdicionar() {
            alert("Abrir formulário de cadastro de produto.");
        }
    </script>
</body>
</html>
