<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>💖 Painel Admin | It Pink Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fff5f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 1.5rem; box-shadow: 0 8px 25px rgba(236, 72, 153, 0.1); }
        h1 { color: #db2777; text-align: center; font-size: 1.8rem; margin-bottom: 25px; }
        h2 { color: #db2777; font-size: 1.3rem; margin-top: 35px; border-bottom: 2px solid #ffe3f0; padding-bottom: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #555; margin-bottom: 8px; font-size: 0.95rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ffccd5; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; background: #fffdfd; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1); }
        button { background: linear-gradient(135deg, #ec4899, #f43f5e); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25); transition: opacity 0.2s; }
        button:hover { opacity: 0.92; }
        
        .grid-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; margin-top: 20px; }
        .card-admin { background: #fff0f6; border: 1px solid #ffe3f0; border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .card-admin img { width: 100%; height: 140px; object-fit: cover; border-radius: 0.5rem; margin-bottom: 0.8rem; background: white; }
        .card-admin h3 { font-size: 0.9rem; margin: 0 0 10px 0; color: #333; line-height: 1.3; }
        .btn-excluir { background: linear-gradient(135deg, #ef4444, #dc2626); width: 100%; padding: 8px; font-size: 0.85rem; border-radius: 8px; box-shadow: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💖 Painel de Controle | It Pink Club</h1>
    
    <form id="form-produto">
        <div class="form-group">
            <label>Título do Produto</label>
            <input type="text" id="titulo" required placeholder="Ex: Organizador de Maquiagem Acrílico">
        </div>
        
        <div class="form-group">
            <label>Categoria</label>
            <select id="categoria">
                <option value="skincare">💄 Beleza</option>
                <option value="casa">🏠 Casa</option>
                <option value="moda">👗 Moda</option>
                <option value="tecnologia">📱 Tecnologia</option>
                <option value="papelaria">🎨 Papelaria</option>
                <option value="pets">🐾 Pets</option>
            </select>
        </div>

        <div class="form-group">
            <label>Link da Imagem (URL ou Foto)</label>
            <input type="text" id="imagem" required placeholder="Cole o link da foto do produto">
        </div>

        <div class="form-group">
            <label>Link de Afiliado da Shopee</label>
            <input type="url" id="link" required placeholder="https://shope.ee/...">
        </div>

        <button type="submit">Cadastrar Achadinho 🚀</button>
    </form>

    <h2>Gerenciar Produtos na Nuvem</h2>
    <div id="container-admin" class="grid-admin">
        <p style="color: #666; font-size: 0.9rem;">Carregando produtos...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9ojNdDkM9M6iO16SW8k7wfWnnJbvHS40",
      authDomain: "itpinkclub-a786e.firebaseapp.com",
      projectId: "itpinkclub-a786e",
      storageBucket: "itpinkclub-a786e.firebasestorage.app",
      messagingSenderId: "716111814812",
      appId: "1:716111814812:web:06e1c76950d39021698d59",
      measurementId: "G-3XSF7CYT1D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('form-produto');
    const containerAdmin = document.getElementById('container-admin');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const novoProduto = {
            titulo: document.getElementById('titulo').value,
            categoria: document.getElementById('categoria').value,
            imagem: document.getElementById('imagem').value,
            link: document.getElementById('link').value,
            criadoEm: new Date()
        };

        try {
            await addDoc(collection(db, "produtos"), novoProduto);
            alert('Achadinho cadastrado com sucesso na nuvem! 💖');
            form.reset();
        } catch (error) {
            console.error("Erro ao cadastrar: ", error);
            alert('Erro ao cadastrar produto.');
        }
    });

    // Listar produtos com cards bonitinhos no admin
    onSnapshot(collection(db, "produtos"), (snapshot) => {
        containerAdmin.innerHTML = '';
        if (snapshot.empty) {
            containerAdmin.innerHTML = '<p style="color: #666; font-size: 0.9rem; grid-column: 1/-1;">Nenhum produto cadastrado na nuvem ainda.</p>';
            return;
        }

        snapshot.forEach((documento) => {
            const prod = documento.data();
            const id = documento.id;

            const card = document.createElement('div');
            card.className = 'card-admin';
            card.innerHTML = `
                <div>
                    <img src="${prod.imagem}" alt="${prod.titulo}">
                    <span style="font-size: 0.7rem; color: #db2777; font-weight: 600; text-transform: uppercase;">${prod.categoria}</span>
                    <h3>${prod.titulo}</h3>
                </div>
                <button class="btn-excluir" onclick="window.excluirProduto('${id}')">Excluir 🗑️</button>
            `;
            containerAdmin.appendChild(card);
        });
    });

    window.excluirProduto = async function(id) {
        if (confirm('Deseja realmente excluir este achadinho?')) {
            try {
                await deleteDoc(doc(db, "produtos", id));
            } catch (error) {
                console.error("Erro ao excluir: ", error);
            }
        }
    };
</script>

</body>
</html>
